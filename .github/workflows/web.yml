name: web
on:
  push: { branches: [main], paths: ['web/**', 'shared/**', 'content/**', '.github/workflows/web.yml'] }
  pull_request: { paths: ['web/**', 'shared/**', 'content/**', '.github/workflows/web.yml'] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - run: npm install
      - run: npm run test -w @findme/shared
      - run: npm run test -w @findme/web
      - run: npm run build -w @findme/web
        env: { FINDME_SKIP_BUILD: '1' }
      - name: Initial JS budget (< 200 KB gzipped)
        run: |
          total=$(find web/dist/assets -name '*.js' ! -name '*pixi*' -exec gzip -c {} \; | wc -c)
          echo "initial JS gzipped: $total bytes"; test "$total" -lt 204800
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }
