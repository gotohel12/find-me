name: web
on:
  push: { branches: [main], paths: ['web/**', 'shared/**', 'content/**', '.github/workflows/web.yml'] }
  pull_request: { paths: ['web/**', 'shared/**', 'content/**', '.github/workflows/web.yml'] }
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - run: npm install
      - run: npm run test -w @findme/shared
      - run: npm run test -w @findme/web
      - run: npm run build -w @findme/web
        env: { FINDME_SKIP_BUILD: '1' }
      - name: Initial JS budget (menu < 200 KB gzipped; the 3D game loads on demand)
        run: |
          total=$(find web/dist/assets -maxdepth 1 -name 'index-*.js' -exec gzip -c {} \; | wc -c)
          game=$(find web/dist/assets -maxdepth 1 -name '*.js' ! -name 'index-*.js' -exec gzip -c {} \; | wc -c)
          echo "menu JS gzipped: $total bytes; 3D game JS gzipped: $game bytes"; test "$total" -lt 204800
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }
      - name: Publish the built site to branch web-preview (for automated browser tests)
        if: github.event_name == 'pull_request'
        run: |
          cd web/dist
          git init -q -b web-preview
          git config user.name "FIND ME web CI"; git config user.email "web-ci@users.noreply.github.com"
          git add -A && git commit -qm "web preview ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-preview
