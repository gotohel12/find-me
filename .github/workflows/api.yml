name: api
on:
  push: { branches: [main], paths: ['api/**', 'shared/**', 'content/**', '.github/workflows/api.yml'] }
  pull_request: { paths: ['api/**', 'shared/**', 'content/**', '.github/workflows/api.yml'] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package.json }
      - run: npm install
      - run: npm run typecheck -w @findme/api
      - run: npm run test -w @findme/api
