name: art
# Renders the FIND ME art library headless with Blender 4.2 LTS — every image is generated by blender/ scripts.
#  - Pull requests touching blender/ or tools/: quick preview render + review sheets on the `art-review` branch.
#  - PR labelled "full-render" (or a manual non-preview run): full quality, one runner per job in parallel,
#    packed web assets committed to the PR branch.
# Developed by Mohsen ~ Danial. © 2026 MD Studio. All rights reserved.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['blender/**', 'tools/**', '.github/workflows/art.yml']
  workflow_dispatch:
    inputs:
      preview: { description: 'Preview quality', type: boolean, default: false }
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: art-${{ github.head_ref || github.ref }}-${{ contains(github.event.pull_request.labels.*.name, 'full-render') }}
  cancel-in-progress: true
env:
  BLENDER_VERSION: 4.2.9
  FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-render') || (github.event_name == 'workflow_dispatch' && !inputs.preview) }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        job: [character, s001_kitchen, s002_workshop, s003_living_room, ui_app_icon]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}
      - name: Install Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          f="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          for base in https://download.blender.org/release/Blender4.2 \
                      https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2 \
                      https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.2 \
                      https://mirror.clarkson.edu/blender/release/Blender4.2; do
            echo "trying $base"
            if curl -fsSL -A "Mozilla/5.0 (FIND ME art CI)" --retry 3 -o /tmp/blender.tar.xz "$base/$f"; then break; fi
          done
          test -s /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C ~/blender --strip-components=1
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxrender1 libsm6 libgl1
      - name: Cache Poly Haven assets
        uses: actions/cache@v4
        with:
          path: build/asset_cache
          key: polyhaven-${{ matrix.job }}-${{ hashFiles('blender/scenes/*.py', 'blender/lib/*.py') }}
          restore-keys: polyhaven-${{ matrix.job }}-
      - name: Render ${{ matrix.job }}
        run: |
          set -o pipefail; mkdir -p build
          BLENDER=$HOME/blender/blender python blender/build_all.py --no-pack --only ${{ matrix.job }} \
            ${{ env.FULL != 'true' && '--preview' || '' }} 2>&1 | tee build/render-${{ matrix.job }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-${{ matrix.job }}
          path: |
            build/art
            build/render-${{ matrix.job }}.log
          retention-days: 7

  pack:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Packer tests
        run: python -m unittest discover -s tools/tests -v
      - uses: actions/download-artifact@v4
        with: { pattern: art-*, path: build, merge-multiple: true }
      - name: Pack
        run: python tools/scene_pack.py --art build/art --out web/public/assets --clean
      - run: python blender/build_all.py --verify
      - name: Review sheets -> branch art-review (viewable without artifact downloads)
        if: always()
        run: |
          python tools/contact_sheet.py --art build/art --out /tmp/review
          python tools/polyhaven_catalog.py /tmp/review/polyhaven_catalog.txt || true
          for f in build/art/scenes/*/credits.json; do [ -f "$f" ] && cp "$f" "/tmp/review/$(basename $(dirname $f))_credits.json"; done
          cat build/render-*.log > /tmp/review/render.log 2>/dev/null || true
          cd /tmp/review
          git init -q -b art-review
          git config user.name "FIND ME art CI"; git config user.email "art-ci@users.noreply.github.com"
          echo "Art review — run ${{ github.run_id }} ($(date -u +%F' '%T) UTC), full=${{ env.FULL }}. Developed by Mohsen ~ Danial. © 2026 MD Studio." > README.md
          git add -A && git commit -qm "art review ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" art-review
      - name: Commit packed assets to the PR branch
        if: env.FULL == 'true' && github.event_name == 'pull_request' && needs.render.result == 'success'
        run: |
          git config user.name "FIND ME art CI"; git config user.email "art-ci@users.noreply.github.com"
          git add -f web/public/assets web/public/icons
          git commit -m "feat(art): rendered art library (run ${{ github.run_id }})" -m "Rendered headless with Blender ${{ env.BLENDER_VERSION }}. Developed by Mohsen ~ Danial. © 2026 MD Studio." || echo "no changes"
          git push origin HEAD:${{ github.head_ref }}
      - name: Open PR with packed assets
        if: github.event_name == 'workflow_dispatch' && env.FULL == 'true' && needs.render.result == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: art/render-${{ github.run_id }}
          commit-message: "feat(art): render art library (run ${{ github.run_id }})"
          title: "Art render ${{ github.run_id }}"
          body: "Rendered headless with Blender ${{ env.BLENDER_VERSION }} by the art workflow. Developed by Mohsen ~ Danial. © 2026 MD Studio."
          add-paths: |
            web/public/assets/**
            web/public/icons/**
