name: art
# Renders the art library headless with Blender 4.2 LTS.
#  - Pull requests touching blender/ or tools/: quick --preview render of everything + packer tests.
#  - Manual run (Actions tab → art → Run workflow): full quality, packed assets opened as a PR.
on:
  pull_request: { paths: ['blender/**', 'tools/**', '.github/workflows/art.yml'] }
  workflow_dispatch:
    inputs:
      only: { description: 'Only jobs matching (comma list, empty = all)', required: false, default: '' }
      preview: { description: 'Preview quality', type: boolean, default: false }
permissions:
  contents: write
  pull-requests: write
env:
  BLENDER_VERSION: 4.2.9
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - name: Packer tests
        run: python -m unittest discover -s tools/tests -v
      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}
      - name: Install Blender
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          f="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          for base in https://download.blender.org/release/Blender4.2 \
                      https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2 \
                      https://ftp.nluug.nl/pub/graphics/blender/release/Blender4.2 \
                      https://mirror.clarkson.edu/blender/release/Blender4.2; do
            echo "trying $base"
            if curl -fsSL -A "Mozilla/5.0 (FIND ME art CI)" --retry 3 -o /tmp/blender.tar.xz "$base/$f"; then break; fi
          done
          test -s /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C ~/blender --strip-components=1
          ~/blender/blender --version | head -1
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxkbcommon0 libxrender1 libsm6 libgl1
      - name: Render
        run: |
          BLENDER=$HOME/blender/blender python blender/build_all.py -j 2 \
            ${{ (github.event_name == 'pull_request' || inputs.preview) && '--preview' || '' }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - run: python blender/build_all.py --verify
      - name: Review sheets -> branch art-review (so they can be viewed without artifact downloads)
        if: always()
        run: |
          python tools/contact_sheet.py --art build/art --out /tmp/review
          cd /tmp/review
          git init -q -b art-review
          git config user.name "FIND ME art CI"; git config user.email "art-ci@users.noreply.github.com"
          echo "Art review — run ${{ github.run_id }} ($(date -u +%F' '%T) UTC). Developed by Mohsen ~ Danial. © 2026 MD Studio." > README.md
          git add -A && git commit -qm "art review ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" art-review
      - uses: actions/upload-artifact@v4
        with: { name: art-build, path: build/art, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: web-assets, path: web/public/assets }
      - name: Open PR with packed assets
        if: github.event_name == 'workflow_dispatch' && !inputs.preview
        uses: peter-evans/create-pull-request@v7
        with:
          branch: art/render-${{ github.run_id }}
          commit-message: "feat(art): render art library (run ${{ github.run_id }})"
          title: "Art render ${{ github.run_id }}"
          body: "Rendered headless with Blender ${{ env.BLENDER_VERSION }} by the art workflow. — Mohsen ~ Danial"
          add-paths: |
            web/public/assets/**
            web/public/icons/**
