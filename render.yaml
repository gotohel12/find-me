# Render Blueprint — FIND ME / لقني. Developed by Mohsen ~ Danial. © 2026 MD Studio.
# One FREE web service (the existing "emberwing" service) serves the game AND the API.
# Database: Neon free Postgres -> paste its connection string as DATABASE_URL in the Render dashboard.
# No cron job (paid on Render): the API works out today's scene from content/schedule.json.
services:
  - type: web
    name: emberwing
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FINDME_SKIP_BUILD
        value: "1"
      - key: DATABASE_URL
        sync: false
